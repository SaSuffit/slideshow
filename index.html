<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="main.css" />
  <link rel="icon" href="blue-hudson_favicon.ico">
  <script src="main.js" defer></script>
  <title>Slideshow - Vehicles</title>
</head>

<body>


  <main>
    <section class="slideContain">

      <figure class="slideshow">
        <div class="numberText">1 / 3</div>
        <img class="image" src="https://cdn.pixabay.com/photo/2013/07/13/11/50/car-158795_1280.png"
          alt="AC Cobra in Blue with white stripe" />
        <div class="text">AC Cobra</div>
      </figure>

      <figure class="slideshow">
        <div class="numberText">2 / 3</div>
        <img class="image" src="https://cdn.pixabay.com/photo/2013/07/12/12/45/car-146185_1280.png"
          alt="1968 Ford Mustang in Black" />
        <div class="text">First Generation Mustang</div>
      </figure>

      <figure class="slideshow">
        <div class="numberText">3 / 3</div>
        <img class="image" src="https://cdn.pixabay.com/photo/2012/04/13/21/05/car-33633_1280.png"
          alt="1945 Citroen 2CV" />
        <div class="text">Citroen 2CV</div>
      </figure>

      <section class="buttonsPic">
        <button onclick="nextPicture(-1)" class="prev">&#10094;</button>
        <button class="dot" onclick="currentPicture(0)"><img src="https://cdn.pixabay.com/photo/2015/04/28/21/20/halftone-744404_1280.png" alt="Button Next"/></button>
        <button class="dot" onclick="currentPicture(1)"><img src="https://cdn.pixabay.com/photo/2015/04/28/21/20/halftone-744404_1280.png" alt="Button Next"/></button>
        <button class="dot" onclick="currentPicture(2)"><img src="https://cdn.pixabay.com/photo/2015/04/28/21/20/halftone-744404_1280.png" alt="Button Next"/></button>
        <button onclick="nextPicture(+1)" class="next">&#10095;</button>
      </section>
    </section>

  </main>
  <footer>Created by Chris</footer>
  </body>
</html>
